[project]
name = "docflow-api"
version = "0.1.0"
description = "Backend services for DocFlow Studio"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.112.0",
  "uvicorn>=0.30.5",
  "python-multipart>=0.0.9",
  "python-pptx>=0.6.23"
]

[tool.uvicorn]
app = "app.main:app"
port = 8000
reload = true
